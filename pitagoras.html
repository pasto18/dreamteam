<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DreamTeam - Pythagorean Calculator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #000000;
    color: #ffffff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .tpv {
    position: relative;
    width: 100%;
    max-width: 380px;
    height: 100vh;
    height: 100dvh;
    background: #000000;
    padding: 16px 14px calc(14px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .brand {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: #555555;
    text-transform: uppercase;
  }
  .history-btn, .nav-btn {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    padding: 4px 6px;
    display: inline-flex;
  }
  .history-btn:active, .nav-btn:active { color: #ffffff; }

  .steps {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #333333;
    transition: background 0.2s;
  }
  .dot.active { background: #ff9f0a; }
  .dot.done { background: #4cd964; }

  /* Screen: no box, numbers floating on black */
  .screen {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 6px 8px 20px;
  }
  .prev-rows { margin-bottom: 4px; }
  .prev-rows .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 1rem;
    color: #8e8e93;
  }
  .prev-rows .summary-row span.v { color: #ffffff; font-weight: 500; }

  .screen .label {
    font-size: 0.95rem;
    color: #8e8e93;
    text-align: right;
    margin-bottom: 6px;
  }
  .screen .value {
    font-size: 4rem;
    font-weight: 300;
    text-align: right;
    color: #ffffff;
    min-height: 1.1em;
    word-break: break-all;
    line-height: 1;
  }
  .screen .value .cursor { color: #ff9f0a; }

  .result-box { text-align: right; margin-top: 16px; }
  .result-box .r-label { font-size: 0.95rem; color: #8e8e93; margin-bottom: 2px; }
  .result-box .r-value {
    font-size: 3.4rem;
    font-weight: 300;
    color: #ff9f0a;
    line-height: 1.05;
  }

  .error {
    color: #ff453a;
    font-size: 0.85rem;
    text-align: right;
    padding: 0 6px;
    min-height: 1.1em;
  }

  /* iPhone-style keypad: circular buttons, 3 columns -> wider */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    justify-items: center;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .keypad button {
    border: none;
    background: #333333;
    color: #ffffff;
    font-size: 1.8rem;
    font-weight: 400;
    cursor: pointer;
    user-select: none;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .keypad button:active { background: #575757; }
  .keypad button.fn { background: #a5a5a5; color: #000000; }
  .keypad button.fn:active { background: #cfcfcf; }

  /* Full-width action button at the very bottom */
  .action-btn {
    width: 100%;
    border: none;
    border-radius: 30px;
    background: #ff9f0a;
    color: #ffffff;
    font-size: 1.25rem;
    font-weight: 600;
    padding: 17px 0;
    margin-top: 14px;
    cursor: pointer;
  }
  .action-btn:active { background: #ffb84d; }

  footer {
    margin-top: 10px;
    text-align: center;
    font-size: 0.68rem;
    color: #444444;
  }

  /* History */
  .history-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.97);
    display: none;
    flex-direction: column;
    padding: 16px 14px;
    z-index: 10;
  }
  .history-overlay.open { display: flex; }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .history-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
  }
  .history-header .close-btn {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 1.3rem;
    cursor: pointer;
  }
  .history-clear {
    background: none;
    border: none;
    color: #ff453a;
    font-size: 0.85rem;
    text-align: right;
    cursor: pointer;
    padding: 0 0 10px;
  }
  .history-list {
    flex: 1;
    overflow-y: auto;
  }
  .history-item {
    padding: 12px 4px;
    border-bottom: 1px solid #1c1c1e;
  }
  .history-item .hi-inputs {
    font-size: 0.85rem;
    color: #8e8e93;
  }
  .history-item .hi-result {
    font-size: 1.4rem;
    font-weight: 500;
    color: #ff9f0a;
    margin-top: 2px;
  }
  .history-empty {
    color: #555555;
    text-align: center;
    margin-top: 40px;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
  <div class="tpv">
    <div class="topbar">
      <a href="index.html" class="nav-btn" title="Tasks">📋</a>
      <div class="brand">DreamTeam · Pythagoras</div>
      <button class="history-btn" id="historyOpenBtn" title="History">📖</button>
    </div>

    <div class="steps">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <!-- Main screen (steps 1, 2 and 3) -->
    <div class="screen" id="mainScreen">
      <div class="prev-rows" id="prevRows"></div>

      <div id="entryBlock">
        <div class="label" id="entryLabel">Enter side A</div>
        <div class="value" id="entryValue">0<span class="cursor">|</span></div>
      </div>

      <div class="result-box" id="resultBlock" style="display:none;">
        <div class="r-label">Hypotenuse</div>
        <div class="r-value" id="sumC">0</div>
      </div>
    </div>
    <div class="error" id="errorMsg">&nbsp;</div>

    <!-- iPhone-style numeric keypad -->
    <div class="keypad" id="entryPad">
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="fn" data-key=".">,</button>
      <button data-key="0">0</button>
      <button class="fn" data-key="back">⌫</button>
    </div>

    <!-- Full-width action button -->
    <button class="action-btn" id="actionBtn">Next ➜</button>

    <footer>a&sup2; + b&sup2; = c&sup2;</footer>

    <!-- History panel -->
    <div class="history-overlay" id="historyOverlay">
      <div class="history-header">
        <h2>History</h2>
        <button class="close-btn" id="historyCloseBtn">✕</button>
      </div>
      <button class="history-clear" id="historyClearBtn">Clear history</button>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

<script>
  const state = { step: 1, a: '', b: '' };
  const HISTORY_KEY = 'dreamteam_pitagoras_history';

  const prevRows = document.getElementById('prevRows');
  const entryBlock = document.getElementById('entryBlock');
  const resultBlock = document.getElementById('resultBlock');
  const entryPad = document.getElementById('entryPad');
  const entryLabel = document.getElementById('entryLabel');
  const entryValue = document.getElementById('entryValue');
  const errorMsg = document.getElementById('errorMsg');
  const actionBtn = document.getElementById('actionBtn');
  const dots = [document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];

  function currentBuffer() {
    return state.step === 1 ? state.a : state.b;
  }
  function setBuffer(v) {
    if (state.step === 1) state.a = v; else state.b = v;
  }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveHistoryEntry(a, b, c) {
    const list = loadHistory();
    list.unshift({ a, b, c, ts: Date.now() });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 50)));
  }
  function renderHistory() {
    const list = loadHistory();
    const container = document.getElementById('historyList');
    if (list.length === 0) {
      container.innerHTML = '<div class="history-empty">No calculations yet</div>';
      return;
    }
    container.innerHTML = list.map(item => {
      const date = new Date(item.ts);
      const fecha = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      return `<div class="history-item">
        <div class="hi-inputs">A = ${item.a}  ·  B = ${item.b}  ·  ${fecha}</div>
        <div class="hi-result">c = ${Number(item.c).toFixed(4)}</div>
      </div>`;
    }).join('');
  }

  function render() {
    dots.forEach((d, i) => {
      d.classList.remove('active', 'done');
      if (i + 1 < state.step) d.classList.add('done');
      else if (i + 1 === state.step) d.classList.add('active');
    });

    // Rows at the top with the values already entered
    let rows = '';
    if (state.step >= 2) {
      rows += `<div class="summary-row"><span>Side A</span><span class="v">${state.a}</span></div>`;
    }
    if (state.step >= 3) {
      rows += `<div class="summary-row"><span>Side B</span><span class="v">${state.b}</span></div>`;
    }
    prevRows.innerHTML = rows;

    if (state.step <= 2) {
      entryBlock.style.display = '';
      resultBlock.style.display = 'none';
      entryPad.style.display = '';
      entryLabel.textContent = state.step === 1 ? 'Enter side A' : 'Enter side B';
      const buf = currentBuffer();
      entryValue.innerHTML = (buf === '' ? '0' : buf) + '<span class="cursor">|</span>';
      errorMsg.textContent = ' ';
      actionBtn.textContent = 'Next ➜';
    } else {
      entryBlock.style.display = 'none';
      resultBlock.style.display = '';
      entryPad.style.display = 'none';
      const a = parseFloat(state.a);
      const b = parseFloat(state.b);
      const c = Math.sqrt(a * a + b * b);
      document.getElementById('sumC').textContent = c.toFixed(4);
      actionBtn.textContent = '🔁 New calculation';
    }
  }

  function handleKey(key) {
    if (state.step > 2) return;
    let buf = currentBuffer();

    if (key === 'back') {
      buf = buf.slice(0, -1);
      setBuffer(buf);
      render();
      return;
    }
    if (key === '.') {
      if (buf.includes('.')) return;
      buf = (buf === '' ? '0' : buf) + '.';
      setBuffer(buf);
      render();
      return;
    }
    if (buf.length >= 10) return;
    buf = buf === '0' ? key : buf + key;
    setBuffer(buf);
    render();
  }

  function handleAction() {
    if (state.step > 2) {
      state.step = 1;
      state.a = '';
      state.b = '';
      render();
      return;
    }
    const buf = currentBuffer();
    const n = parseFloat(buf);
    if (buf === '' || isNaN(n) || n <= 0) {
      errorMsg.textContent = 'Enter a valid number greater than 0';
      return;
    }
    if (state.step === 2) {
      const a = parseFloat(state.a);
      const b = parseFloat(state.b);
      const c = Math.sqrt(a * a + b * b);
      saveHistoryEntry(a, b, c);
    }
    state.step += 1;
    render();
  }

  entryPad.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    handleKey(btn.dataset.key);
  });
  actionBtn.addEventListener('click', handleAction);

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('historyOverlay').classList.contains('open')) return;
    if (state.step <= 2) {
      if (/^[0-9]$/.test(e.key)) handleKey(e.key);
      else if (e.key === '.' || e.key === ',') handleKey('.');
      else if (e.key === 'Backspace') handleKey('back');
      else if (e.key === 'Enter') handleAction();
    } else if (e.key === 'Enter') {
      handleAction();
    }
  });

  // History: open / close / clear
  const historyOverlay = document.getElementById('historyOverlay');
  document.getElementById('historyOpenBtn').addEventListener('click', () => {
    renderHistory();
    historyOverlay.classList.add('open');
  });
  document.getElementById('historyCloseBtn').addEventListener('click', () => {
    historyOverlay.classList.remove('open');
  });
  document.getElementById('historyClearBtn').addEventListener('click', () => {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  });

  render();
</script>
</body>
</html>
