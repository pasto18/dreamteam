<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f3f2f2">
<title>DreamTeam - Pythagorean Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #f3f2f2; --surface: #eae9e9; --ink: #201e1d; --accent: #ec3013;
    --divider: color-mix(in srgb, #201e1d 40%, transparent);
    --n300: #d7d3d3; --n700: #605d5d; --a100: #fff2ef; --a700: #ae1800;
    --font: "Archivo", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: left; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  .tpv { position: relative; max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; border-bottom: 2px solid var(--divider); padding: 4px; padding-top: calc(4px + env(safe-area-inset-top)); }
  .head .h { flex: 1; font-weight: 800; font-size: 17px; }
  .icon-btn { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; }
  .icon-btn:active { background: var(--surface); }

  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--divider); }
  .step { padding: 10px 12px 8px; border-bottom: 4px solid transparent; min-width: 0; }
  .step + .step { border-left: 1px solid var(--divider); }
  .step.active { border-bottom-color: var(--accent); }
  .step .l { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--n700); }
  .step .v { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .v.c { color: var(--a700); }

  .screen { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px 16px; }
  .label { font-size: 15px; font-weight: 600; color: var(--n700); }
  .value-row { display: flex; align-items: flex-end; gap: 4px; margin-top: 4px; min-width: 0; }
  .value { font-weight: 800; font-size: clamp(40px, 11vh, 72px); line-height: .95; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; word-break: break-all; }
  .value.result { color: var(--accent); }
  .cursor { flex: none; width: 4px; height: clamp(32px, 9vh, 60px); background: var(--accent); margin-bottom: 4px; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .formula { font-size: 14px; color: var(--n700); margin-top: 10px; }
  .error { min-height: 20px; margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--a700); }

  .keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--divider); border-top: 2px solid var(--divider); flex-shrink: 0; }
  .keypad button { height: clamp(48px, 8vh, 64px); padding: 0 20px; display: flex; align-items: center; background: var(--bg); font-weight: 600; font-size: 28px; user-select: none; }
  .keypad button.fn { background: var(--surface); }
  .keypad button:active { background: var(--n300); }

  .action-wrap { padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); border-top: 2px solid var(--ink); flex-shrink: 0; }
  .action-btn { width: 100%; height: 60px; padding: 0 18px; display: flex; align-items: center; background: var(--accent); color: var(--bg); font-weight: 800; font-size: 18px; }
  .action-btn:active { background: var(--a700); }
  .action-btn svg.i { margin-left: auto; }

  .history-overlay { position: absolute; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
  .history-overlay.open { display: flex; }
  .history-clear { height: 48px; padding: 0 12px; font-size: 14px; font-weight: 800; color: var(--a700); }
  .history-clear:active { background: var(--a100); }
  .history-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
  .history-item { padding: 14px 16px; border-bottom: 1px solid var(--divider); }
  .hi-result { font-weight: 800; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .hi-inputs { font-size: 13px; color: var(--n700); margin-top: 4px; }
  .history-empty { padding: 24px 16px; font-size: 15px; color: var(--n700); }
</style>
</head>
<body>
  <div class="tpv">
    <div class="head">
      <a href="index.html" class="icon-btn" aria-label="Back to tasks"><svg class="i" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></a>
      <div class="h">Pythagoras</div>
      <button class="icon-btn" id="historyOpenBtn" aria-label="History"><svg class="i" viewBox="0 0 24 24" style="stroke-width:2;width:22px;height:22px"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg></button>
    </div>

    <div class="steps">
      <div class="step" id="step1"><div class="l">Side a</div><div class="v" id="stepVal1">—</div></div>
      <div class="step" id="step2"><div class="l">Side b</div><div class="v" id="stepVal2">—</div></div>
      <div class="step" id="step3"><div class="l">Hyp. c</div><div class="v c" id="stepVal3">—</div></div>
    </div>

    <div class="screen">
      <div id="entryBlock">
        <div class="label" id="entryLabel">Enter side a</div>
        <div class="value-row"><span class="value" id="entryValue">0</span><span class="cursor"></span></div>
      </div>
      <div id="resultBlock" style="display:none;">
        <div class="label">Hypotenuse c</div>
        <div class="value result" id="sumC">0</div>
        <div class="formula">a² + b² = c²</div>
      </div>
      <div class="error" id="errorMsg"></div>
    </div>

    <div class="keypad" id="entryPad">
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="fn" data-key=".">,</button>
      <button data-key="0">0</button>
      <button class="fn" data-key="back" aria-label="Delete">⌫</button>
    </div>

    <div class="action-wrap">
      <button class="action-btn" id="actionBtn"><span id="actionLabel">Next · side b</span><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </div>

    <div class="history-overlay" id="historyOverlay">
      <div class="head">
        <button class="icon-btn" id="historyCloseBtn" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
        <div class="h">History</div>
        <button class="history-clear" id="historyClearBtn">Clear</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

<script>
  const state = { step: 1, a: '', b: '' };
  const HISTORY_KEY = 'dreamteam_pitagoras_history';

  const entryBlock = document.getElementById('entryBlock');
  const resultBlock = document.getElementById('resultBlock');
  const entryPad = document.getElementById('entryPad');
  const entryLabel = document.getElementById('entryLabel');
  const entryValue = document.getElementById('entryValue');
  const errorMsg = document.getElementById('errorMsg');
  const actionBtn = document.getElementById('actionBtn');
  const actionLabel = document.getElementById('actionLabel');
  const stepEls = [1, 2, 3].map(n => document.getElementById('step' + n));
  const stepVals = [1, 2, 3].map(n => document.getElementById('stepVal' + n));

  function currentBuffer() { return state.step === 1 ? state.a : state.b; }
  function setBuffer(v) { if (state.step === 1) state.a = v; else state.b = v; }

  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveHistoryEntry(a, b, c) {
    const list = loadHistory();
    list.unshift({ a, b, c, ts: Date.now() });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 50)));
  }
  function renderHistory() {
    const list = loadHistory();
    const container = document.getElementById('historyList');
    document.getElementById('historyClearBtn').style.visibility = list.length ? 'visible' : 'hidden';
    if (list.length === 0) {
      container.innerHTML = '<div class="history-empty">No calculations yet.</div>';
      return;
    }
    container.innerHTML = list.map(item => {
      const date = new Date(item.ts);
      const when = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return `<div class="history-item">
        <div class="hi-result">c = ${Number(item.c).toFixed(4)}</div>
        <div class="hi-inputs">a = ${item.a} · b = ${item.b} · ${when}</div>
      </div>`;
    }).join('');
  }

  function render() {
    stepEls.forEach((el, i) => el.classList.toggle('active', i + 1 === state.step));
    stepVals[0].textContent = state.a || '—';
    stepVals[1].textContent = state.b || '—';

    if (state.step <= 2) {
      entryBlock.style.display = '';
      resultBlock.style.display = 'none';
      entryPad.style.display = '';
      entryLabel.textContent = state.step === 1 ? 'Enter side a' : 'Enter side b';
      const buf = currentBuffer();
      entryValue.textContent = buf === '' ? '0' : buf;
      stepVals[2].textContent = '—';
      actionLabel.textContent = state.step === 1 ? 'Next · side b' : 'Calculate c';
    } else {
      entryBlock.style.display = 'none';
      resultBlock.style.display = '';
      entryPad.style.display = 'none';
      const a = parseFloat(state.a), b = parseFloat(state.b);
      const c = Math.sqrt(a * a + b * b).toFixed(4);
      document.getElementById('sumC').textContent = c;
      stepVals[2].textContent = c;
      actionLabel.textContent = 'New calculation';
    }
  }

  function handleKey(key) {
    if (state.step > 2) return;
    let buf = currentBuffer();
    errorMsg.textContent = '';
    if (key === 'back') { setBuffer(buf.slice(0, -1)); render(); return; }
    if (key === '.') {
      if (buf.includes('.')) return;
      setBuffer((buf === '' ? '0' : buf) + '.');
      render();
      return;
    }
    if (buf.length >= 10) return;
    setBuffer(buf === '0' ? key : buf + key);
    render();
  }

  function handleAction() {
    if (state.step > 2) {
      state.step = 1; state.a = ''; state.b = '';
      errorMsg.textContent = '';
      render();
      return;
    }
    const buf = currentBuffer();
    const n = parseFloat(buf);
    if (buf === '' || isNaN(n) || n <= 0) {
      errorMsg.textContent = 'Enter a number greater than 0';
      return;
    }
    if (state.step === 2) {
      const a = parseFloat(state.a), b = parseFloat(state.b);
      saveHistoryEntry(a, b, Math.sqrt(a * a + b * b));
    }
    errorMsg.textContent = '';
    state.step += 1;
    render();
  }

  entryPad.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (btn) handleKey(btn.dataset.key);
  });
  actionBtn.addEventListener('click', handleAction);

  document.addEventListener('keydown', (e) => {
    if (historyOverlay.classList.contains('open')) return;
    if (state.step <= 2) {
      if (/^[0-9]$/.test(e.key)) handleKey(e.key);
      else if (e.key === '.' || e.key === ',') handleKey('.');
      else if (e.key === 'Backspace') handleKey('back');
      else if (e.key === 'Enter') handleAction();
    } else if (e.key === 'Enter') {
      handleAction();
    }
  });

  const historyOverlay = document.getElementById('historyOverlay');
  document.getElementById('historyOpenBtn').addEventListener('click', () => { renderHistory(); historyOverlay.classList.add('open'); });
  document.getElementById('historyCloseBtn').addEventListener('click', () => historyOverlay.classList.remove('open'));
  document.getElementById('historyClearBtn').addEventListener('click', () => { localStorage.removeItem(HISTORY_KEY); renderHistory(); });

  render();
</script>
</body>
</html>
