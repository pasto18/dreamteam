<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DreamTeam - Calculadora de Pitágoras</title>
<style>
  :root {
    color-scheme: light dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    padding: 24px;
  }
  .card {
    background: #1e293bcc;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    text-align: center;
  }
  p.subtitle {
    margin: 0 0 24px;
    text-align: center;
    color: #94a3b8;
    font-size: 0.9rem;
  }
  .field {
    margin-bottom: 16px;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.9rem;
    color: #cbd5e1;
  }
  input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 1rem;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: #38bdf8;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover {
    background: #0ea5e9;
  }
  .result {
    margin-top: 20px;
    padding: 16px;
    border-radius: 8px;
    background: #0f172a;
    text-align: center;
    font-size: 1.1rem;
    min-height: 1.4em;
  }
  .result strong {
    color: #4ade80;
  }
  .error {
    color: #f87171;
  }
  footer {
    margin-top: 20px;
    text-align: center;
    font-size: 0.75rem;
    color: #64748b;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Calculadora de Pitágoras</h1>
    <p class="subtitle">Calcula la hipotenusa a partir de los catetos</p>

    <div class="field">
      <label for="a">Cateto a</label>
      <input type="number" id="a" placeholder="Ej: 3" step="any" min="0">
    </div>

    <div class="field">
      <label for="b">Cateto b</label>
      <input type="number" id="b" placeholder="Ej: 4" step="any" min="0">
    </div>

    <button onclick="calcularHipotenusa()">Calcular hipotenusa</button>

    <div class="result" id="resultado"></div>

    <footer>DreamTeam &middot; a&sup2; + b&sup2; = c&sup2;</footer>
  </div>

  <script>
    function calcularHipotenusa() {
      const a = parseFloat(document.getElementById('a').value);
      const b = parseFloat(document.getElementById('b').value);
      const resultado = document.getElementById('resultado');

      if (isNaN(a) || isNaN(b) || a < 0 || b < 0) {
        resultado.innerHTML = '<span class="error">Ingresa dos números válidos y positivos.</span>';
        return;
      }

      const c = Math.sqrt(a * a + b * b);
      resultado.innerHTML = `La hipotenusa es <strong>${c.toFixed(4)}</strong>`;
    }

    document.getElementById('b').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') calcularHipotenusa();
    });
    document.getElementById('a').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') calcularHipotenusa();
    });
  </script>
</body>
</html>
