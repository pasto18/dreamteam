<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DreamTeam - Tasks</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #000000;
    color: #ffffff;
  }
  body {
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom));
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: #555555;
    text-transform: uppercase;
  }
  .title {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 2px 0 0;
  }
  .nav-btn {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    padding: 10px;
    margin: -10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn:active { color: #ffffff; }

  .progress {
    margin-bottom: 14px;
  }
  .progress-text {
    font-size: 0.85rem;
    color: #8e8e93;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    border-radius: 3px;
    background: #1c1c1e;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #4cd964;
    border-radius: 3px;
    width: 0%;
    transition: width 0.25s;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .filter-btn {
    flex-shrink: 0;
    border: none;
    background: #1c1c1e;
    color: #8e8e93;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 20px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #ff9f0a;
    color: #000000;
  }

  .add-btn {
    width: 100%;
    border: 1px dashed #3a3a3c;
    background: none;
    color: #8e8e93;
    font-size: 1rem;
    font-weight: 500;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .add-btn:active { background: #1c1c1e; }

  .add-form {
    background: #1c1c1e;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .add-form.open { display: flex; }
  .form-input {
    width: 100%;
    background: #000000;
    border: 1px solid #2c2c2e;
    border-radius: 8px;
    color: #ffffff;
    font-size: 16px;
    padding: 12px 12px;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .form-input:focus { outline: none; border-color: #ff9f0a; }
  .form-input::placeholder { color: #555555; }
  .form-actions {
    display: flex;
    gap: 10px;
  }
  .form-actions button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .form-submit { background: #ff9f0a; color: #000000; }
  .form-submit:active { background: #ffb84d; }
  .form-cancel { background: #2c2c2e; color: #ffffff; }
  .form-cancel:active { background: #3a3a3c; }

  .list {
    display: flex;
    flex-direction: column;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 14px 4px;
    border-bottom: 1px solid #1c1c1e;
  }
  .task.hidden { display: none; }

  .status-btn {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid #48484a;
    background: transparent;
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-top: 1px;
  }
  .status-btn.progress {
    border-color: #ff9f0a;
    background: #ff9f0a;
  }
  .status-btn.done {
    border-color: #4cd964;
    background: #4cd964;
    color: #04310f;
  }

  .task-body {
    flex: 1;
    min-width: 0;
  }
  .task-text {
    font-size: 1rem;
    line-height: 1.4;
    color: #f2f2f7;
  }
  .task-text.done {
    color: #6d6d70;
    text-decoration: line-through;
  }

  .task-body { cursor: pointer; }

  .meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 10px;
  }
  .meta-input {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid #2c2c2e;
    color: #ffffff;
    font-size: 16px;
    padding: 9px 0;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    border-radius: 0;
  }
  .meta-input:focus { outline: none; border-bottom-color: #ff9f0a; }
  .meta-input::placeholder { color: #555555; }
  .meta-input.tools { color: #64d2ff; }
  .meta-input.location { color: #ff6482; }

  .chip-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .chip {
    border: none;
    background: #1c1c1e;
    color: #8e8e93;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .chip.active {
    background: #ff9f0a;
    color: #000000;
  }
  .chip.everyone.active {
    background: #64d2ff;
    color: #000000;
  }

  .delete-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: #48484a;
    font-size: 1.1rem;
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: -4px -4px 0 0;
  }
  .delete-btn:active { color: #ff453a; }

  footer {
    margin-top: 18px;
    text-align: center;
    font-size: 0.68rem;
    color: #444444;
  }

  /* Detail panel: notes and photos (not shown in the main list) */
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: #000000;
    display: none;
    flex-direction: column;
    z-index: 50;
  }
  .detail-overlay.open { display: flex; }
  .detail-inner {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow-y: auto;
  }
  .detail-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .detail-back {
    background: none;
    border: none;
    color: #ff9f0a;
    font-size: 1.6rem;
    padding: 8px;
    margin: -8px;
    cursor: pointer;
  }
  .detail-header h2 {
    font-size: 1rem;
    font-weight: 600;
    margin: 0;
    color: #8e8e93;
  }
  .detail-text {
    font-size: 1.15rem;
    line-height: 1.4;
    margin-bottom: 20px;
  }
  .detail-inner .meta-input,
  .detail-inner .chip-wrap {
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 0.8rem;
    color: #8e8e93;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .notes-textarea {
    width: 100%;
    min-height: 110px;
    background: #1c1c1e;
    border: 1px solid #2c2c2e;
    border-radius: 12px;
    color: #ffffff;
    font-size: 16px;
    font-family: inherit;
    padding: 12px;
    resize: vertical;
    margin-bottom: 24px;
  }
  .notes-textarea:focus { outline: none; border-color: #ff9f0a; }
  .notes-textarea::placeholder { color: #555555; }

  .photos-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .photo-thumb {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    overflow: hidden;
    background: #1c1c1e;
  }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
  }
  .photo-thumb .photo-remove {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.65);
    color: #ffffff;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .photo-thumb.uploading img { opacity: 0.4; }
  .photo-thumb .spinner {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
  }

  .add-photo-btn {
    width: 100%;
    border: 1px dashed #3a3a3c;
    background: none;
    color: #8e8e93;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 14px;
    border-radius: 12px;
    cursor: pointer;
  }
  .add-photo-btn:active { background: #1c1c1e; }

  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">DreamTeam</div>
        <div class="title">Tasks</div>
      </div>
      <a href="pitagoras.html" class="nav-btn" title="Calculator">🧮</a>
    </div>

    <div class="progress">
      <div class="progress-text" id="progressText">0/0 completed</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="progress">In progress</button>
      <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <button class="add-btn" id="addToggleBtn">+ Add task</button>
    <div class="add-form" id="addForm">
      <input class="form-input" id="newText" placeholder="Task description">
      <input class="form-input" id="newTools" placeholder="🧰 Tools needed">
      <input class="form-input" id="newLocation" placeholder="📍 Site / tent">
      <div class="chip-wrap" id="newAssigneeChips"></div>
      <div class="form-actions">
        <button class="form-cancel" id="cancelAddBtn" type="button">Cancel</button>
        <button class="form-submit" id="submitAddBtn" type="button">Add</button>
      </div>
    </div>

    <div class="list" id="taskList"></div>

    <footer>Tap the circle to change status · 🗑 to delete</footer>
  </div>

  <!-- Detail panel: private notes and photos for the task -->
  <div class="detail-overlay" id="detailOverlay">
    <div class="detail-inner">
      <div class="detail-header">
        <button class="detail-back" id="detailBackBtn">←</button>
        <h2>Task details</h2>
      </div>
      <div class="detail-text" id="detailText"></div>

      <div class="section-label">Assigned to</div>
      <div class="chip-wrap" id="detailAssigneeChips"></div>

      <div class="section-label">Tools needed</div>
      <input class="meta-input tools" type="text" id="detailTools" placeholder="e.g. hammer, nails, ladder...">

      <div class="section-label">Site / tent</div>
      <input class="meta-input location" type="text" id="detailLocation" placeholder="e.g. Dream Team container...">

      <div class="section-label">Notes</div>
      <textarea class="notes-textarea" id="notesTextarea" placeholder="Private notes for this task (not shown in the main list)..."></textarea>

      <div class="section-label">Photos</div>
      <div class="photos-grid" id="photosGrid"></div>
      <button class="add-photo-btn" id="addPhotoBtn">📷 Add photo</button>
      <input type="file" accept="image/*" multiple id="photoInput" style="display:none;">
    </div>
  </div>

  <!-- Full-screen photo viewer -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="">
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, setDoc, addDoc, deleteDoc, onSnapshot,
    updateDoc, arrayUnion, arrayRemove
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
  import {
    getStorage, ref as storageRef, uploadBytes, getDownloadURL, deleteObject
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCiXcWoZLR37Ildi1Uy1N-cgXkOPuamV2A",
    authDomain: "dreamteam-9ba54.firebaseapp.com",
    projectId: "dreamteam-9ba54",
    storageBucket: "dreamteam-9ba54.firebasestorage.app",
    messagingSenderId: "796331884443",
    appId: "1:796331884443:web:a18eb67205ff3799f82b3e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const tasksCol = collection(db, 'tasks');

  // Initial definitions (used only once, to seed the database the first time)
  const SEED_TASKS = [
    { id: 1,  emoji: '🔨', text: 'Put new wood on trailer subardo', assignee: '' },
    { id: 2,  emoji: '🔨', text: 'DT CONTAINER - set up scaffolding container dream team (ask Patrick to weld some parts?)', assignee: '' },
    { id: 3,  emoji: '🔨', text: "make a roof outside the door of dream team container, where there is already wood and a shitty fabric on it, (something hard so it doesn't rip off with the wind)", assignee: '' },
    { id: 4,  emoji: '🔧', text: 'konsum antenas upper parts need to be fixed by Patrick', assignee: 'Patrick' },
    { id: 5,  emoji: '🔨', text: 'DT CONTAINER - make the door of the DT container (also we need Patrick to weld)', assignee: 'Patrick' },
    { id: 6,  emoji: '🏷️', text: 'Label all the nails boxes for every tent', assignee: '' },
    { id: 7,  emoji: '📏', text: 'measure konsum picas - LISI and..', assignee: 'Lisi' },
    { id: 8,  emoji: '📏', text: 'measure subardo picas (puertas?) - LISI and..', assignee: 'Lisi' },
    { id: 9,  emoji: '🧹', text: 'DT CONTAINER - clean entrance container dream team', assignee: '' },
    { id: 10, emoji: '⛺', text: 'build down backstage of ballena', assignee: '' },
    { id: 11, emoji: '⛺', text: 'take care of rosa platz', assignee: '' },
    { id: 12, emoji: '⛺', text: 'take care of african tents (1 velvet soup, 2 behind salon de baile, 1 kitchen tanzwuste, 1 behind konsum)', assignee: '' },
    { id: 13, emoji: '🪢', text: 'DT CONTAINER - change the rope in the roof of the arch (cherry picker, 2 people) - FELIX and FABRI', assignee: 'Felix, Fabri' },
    { id: 14, emoji: '👀', text: 'Moltons LaBalena - find a solution to keep them safe - bags Fabri knows, same fabric as Palapa', assignee: '' },
    { id: 15, emoji: '🚜', text: 'take the arch of ballena door to dream team container - MANDA - HELENE', assignee: 'Manda, Helene' },
    { id: 16, emoji: '🚜', text: 'tapar trailer madera tribuna palapa', assignee: '' },
    { id: 17, emoji: '🚜', text: 'put the lower parts of the antenas of konsum in rosa platz - MANDA - HELENE', assignee: 'Manda, Helene' },
    { id: 18, emoji: '🚜', text: 'cargar trailer azul con metal de tribune de ballena - WALID-ANTO', assignee: 'Walid, Anto' },
  ];

  const STATUS_ORDER = ['pending', 'progress', 'done'];
  const DEFAULT_EMOJI = '📌';
  const NAMES = ['German', 'Fran', 'Laura', 'Fabri', 'Felix', 'Flavia', 'Manda', 'Juani', 'Joan', 'Anto', 'Walid', 'Lisi', 'Helene']
    .sort((a, b) => a.localeCompare(b, 'es'));

  function assigneeChipsHtml(assignees) {
    const list = assignees || [];
    const everyoneActive = NAMES.length > 0 && NAMES.every(n => list.includes(n));
    const chips = [`<button type="button" class="chip everyone ${everyoneActive ? 'active' : ''}" data-name="__everyone__">👥 Everyone</button>`];
    list.filter(n => !NAMES.includes(n)).forEach(n => {
      chips.push(`<button type="button" class="chip active" data-name="${escapeAttr(n)}">${escapeHtml(n)}</button>`);
    });
    NAMES.forEach(n => {
      chips.push(`<button type="button" class="chip ${list.includes(n) ? 'active' : ''}" data-name="${escapeAttr(n)}">${escapeHtml(n)}</button>`);
    });
    return chips.join('');
  }

  function toggleAssignee(list, name) {
    const current = list || [];
    if (name === '__everyone__') {
      const allSelected = NAMES.every(n => current.includes(n));
      const extras = current.filter(n => !NAMES.includes(n));
      return allSelected ? extras : [...extras, ...NAMES];
    }
    return current.includes(name) ? current.filter(n => n !== name) : [...current, name];
  }

  let tasks = [];
  let currentFilter = 'all';
  let currentDetailId = null;

  const listEl = document.getElementById('taskList');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');

  function splitLegacyAssignee(str) {
    return String(str || '').split(',').map(s => s.trim()).filter(Boolean);
  }

  async function ensureSeeded() {
    await Promise.all(SEED_TASKS.map(async (t) => {
      const ref = doc(db, 'tasks', String(t.id));
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          emoji: t.emoji,
          text: t.text,
          assignees: splitLegacyAssignee(t.assignee),
          tools: '',
          location: '',
          status: 'pending',
          order: t.id,
        });
        return;
      }
      // Migration: fill in any missing new fields without overwriting what the team already edited
      const data = snap.data();
      const patch = {};
      if (data.text === undefined) patch.text = t.text;
      if (data.emoji === undefined) patch.emoji = t.emoji;
      if (data.tools === undefined) patch.tools = '';
      if (data.location === undefined) patch.location = '';
      if (data.order === undefined) patch.order = t.id;
      if (data.assignees === undefined) {
        patch.assignees = data.assignee !== undefined ? splitLegacyAssignee(data.assignee) : splitLegacyAssignee(t.assignee);
      }
      if (Object.keys(patch).length) await setDoc(ref, patch, { merge: true });
    }));
  }

  function mergeSnapshot(snapshot) {
    const list = [];
    snapshot.forEach(d => {
      const data = d.data();
      list.push({
        id: d.id,
        emoji: data.emoji || DEFAULT_EMOJI,
        text: data.text || '',
        assignees: Array.isArray(data.assignees) ? data.assignees : splitLegacyAssignee(data.assignee),
        tools: data.tools || '',
        location: data.location || '',
        status: data.status || 'pending',
        order: typeof data.order === 'number' ? data.order : 0,
        notes: data.notes || '',
        photos: Array.isArray(data.photos) ? data.photos : [],
      });
    });
    list.sort((a, b) => a.order - b.order);
    tasks = list;
    render();
  }

  ensureSeeded()
    .then(() => onSnapshot(tasksCol, mergeSnapshot, (err) => console.error('Firestore error:', err)))
    .catch((err) => console.error('Error initializing Firestore:', err));

  function renderProgress() {
    const done = tasks.filter(t => t.status === 'done').length;
    progressText.textContent = `${done}/${tasks.length} completed`;
    progressFill.style.width = tasks.length ? `${(done / tasks.length) * 100}%` : '0%';
  }

  function renderList() {
    listEl.innerHTML = tasks.map(t => {
      const isDone = t.status === 'done';
      const checkIcon = isDone ? '✓' : '';
      const prefix = isDone ? '✅ ' : '';
      const hiddenClass = (currentFilter !== 'all' && t.status !== currentFilter) ? 'hidden' : '';
      return `
        <div class="task ${hiddenClass}" data-id="${t.id}">
          <button class="status-btn ${t.status}" data-action="cycle" data-id="${t.id}">${checkIcon}</button>
          <div class="task-body" data-action="open-detail" data-id="${t.id}">
            <div class="task-text ${isDone ? 'done' : ''}">${prefix}${t.emoji} ${escapeHtml(t.text)}</div>
          </div>
          <button class="delete-btn" data-action="delete" data-id="${t.id}" title="Delete task">🗑</button>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function render() {
    renderProgress();
    renderList();
    if (currentDetailId) renderDetail();
  }

  const fieldTimers = {};

  listEl.addEventListener('click', (e) => {
    const cycleBtn = e.target.closest('[data-action="cycle"]');
    if (cycleBtn) {
      const id = cycleBtn.dataset.id;
      const task = tasks.find(t => t.id === id);
      const idx = STATUS_ORDER.indexOf(task.status);
      task.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
      render();
      setDoc(doc(db, 'tasks', id), { status: task.status }, { merge: true }).catch(console.error);
      return;
    }
    const deleteBtn = e.target.closest('[data-action="delete"]');
    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      const task = tasks.find(t => t.id === id);
      if (task && confirm(`Delete task "${task.text.slice(0, 60)}"?`)) {
        (task.photos || []).forEach(p => deleteObject(storageRef(storage, p.path)).catch(() => {}));
        deleteDoc(doc(db, 'tasks', id)).catch(console.error);
      }
      return;
    }
    const openBtn = e.target.closest('[data-action="open-detail"]');
    if (openBtn) {
      openDetail(openBtn.dataset.id);
      return;
    }
  });

  function scheduleFieldSave(id, field, value, delay) {
    const key = id + ':' + field;
    clearTimeout(fieldTimers[key]);
    fieldTimers[key] = setTimeout(() => {
      setDoc(doc(db, 'tasks', id), { [field]: value }, { merge: true }).catch(console.error);
    }, delay);
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderList();
    });
  });

  // Add new task
  const addToggleBtn = document.getElementById('addToggleBtn');
  const addForm = document.getElementById('addForm');
  const newText = document.getElementById('newText');
  const newTools = document.getElementById('newTools');
  const newLocation = document.getElementById('newLocation');
  const newAssigneeChips = document.getElementById('newAssigneeChips');
  let newAssigneeSelection = [];
  newAssigneeChips.innerHTML = assigneeChipsHtml(newAssigneeSelection);

  newAssigneeChips.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    newAssigneeSelection = toggleAssignee(newAssigneeSelection, chip.dataset.name);
    newAssigneeChips.innerHTML = assigneeChipsHtml(newAssigneeSelection);
  });

  function resetAddForm() {
    newText.value = '';
    newTools.value = '';
    newLocation.value = '';
    newAssigneeSelection = [];
    newAssigneeChips.innerHTML = assigneeChipsHtml(newAssigneeSelection);
  }

  addToggleBtn.addEventListener('click', () => {
    addForm.classList.toggle('open');
    if (addForm.classList.contains('open')) newText.focus();
  });

  document.getElementById('cancelAddBtn').addEventListener('click', () => {
    resetAddForm();
    addForm.classList.remove('open');
  });

  document.getElementById('submitAddBtn').addEventListener('click', async () => {
    const text = newText.value.trim();
    if (!text) { newText.focus(); return; }
    await addDoc(tasksCol, {
      emoji: DEFAULT_EMOJI,
      text,
      tools: newTools.value.trim(),
      location: newLocation.value.trim(),
      assignees: newAssigneeSelection,
      status: 'pending',
      order: Date.now(),
    });
    resetAddForm();
    addForm.classList.remove('open');
  });

  // Detail panel: private notes and photos for the task
  const detailOverlay = document.getElementById('detailOverlay');
  const detailText = document.getElementById('detailText');
  const detailAssigneeChips = document.getElementById('detailAssigneeChips');
  const detailTools = document.getElementById('detailTools');
  const detailLocation = document.getElementById('detailLocation');
  const notesTextarea = document.getElementById('notesTextarea');
  const photosGrid = document.getElementById('photosGrid');
  const addPhotoBtn = document.getElementById('addPhotoBtn');
  const photoInput = document.getElementById('photoInput');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  let pendingUploads = 0; // photos currently uploading, to show the spinner

  function openDetail(id) {
    currentDetailId = id;
    pendingUploads = 0;
    renderDetail();
    detailOverlay.classList.add('open');
  }

  function closeDetail() {
    currentDetailId = null;
    detailOverlay.classList.remove('open');
  }

  function renderDetail() {
    const task = tasks.find(t => t.id === currentDetailId);
    if (!task) { closeDetail(); return; }

    const active = document.activeElement;

    detailText.textContent = `${task.emoji} ${task.text}`;
    detailAssigneeChips.innerHTML = assigneeChipsHtml(task.assignees);
    if (active !== detailTools) detailTools.value = task.tools || '';
    if (active !== detailLocation) detailLocation.value = task.location || '';
    if (active !== notesTextarea) notesTextarea.value = task.notes || '';

    const photos = task.photos || [];
    photosGrid.innerHTML = photos.map(p => `
      <div class="photo-thumb">
        <img src="${escapeAttr(p.url)}" data-action="view-photo" data-url="${escapeAttr(p.url)}">
        <button class="photo-remove" data-action="remove-photo" data-path="${escapeAttr(p.path)}" data-url="${escapeAttr(p.url)}">✕</button>
      </div>`).join('') + (pendingUploads > 0
        ? Array.from({ length: pendingUploads }).map(() => `
      <div class="photo-thumb uploading"><div class="spinner">⏳</div></div>`).join('')
        : '');
  }

  document.getElementById('detailBackBtn').addEventListener('click', closeDetail);

  notesTextarea.addEventListener('input', () => {
    const id = currentDetailId;
    if (!id) return;
    const task = tasks.find(t => t.id === id);
    if (task) task.notes = notesTextarea.value;
    scheduleFieldSave(id, 'notes', notesTextarea.value, 500);
  });

  detailAssigneeChips.addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const id = currentDetailId;
    if (!id) return;
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    task.assignees = toggleAssignee(task.assignees, chip.dataset.name);
    detailAssigneeChips.innerHTML = assigneeChipsHtml(task.assignees);
    scheduleFieldSave(id, 'assignees', task.assignees, 0);
  });

  detailTools.addEventListener('input', () => {
    const id = currentDetailId;
    if (!id) return;
    const task = tasks.find(t => t.id === id);
    if (task) task.tools = detailTools.value;
    scheduleFieldSave(id, 'tools', detailTools.value, 500);
  });

  detailLocation.addEventListener('input', () => {
    const id = currentDetailId;
    if (!id) return;
    const task = tasks.find(t => t.id === id);
    if (task) task.location = detailLocation.value;
    scheduleFieldSave(id, 'location', detailLocation.value, 500);
  });

  function compressImage(file, maxDim = 1600, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const objectUrl = URL.createObjectURL(file);
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(objectUrl);
          resolve(blob || file);
        }, 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('Could not read the image')); };
      img.src = objectUrl;
    });
  }

  addPhotoBtn.addEventListener('click', () => photoInput.click());

  photoInput.addEventListener('change', async () => {
    const id = currentDetailId;
    const files = Array.from(photoInput.files || []);
    photoInput.value = '';
    if (!id || files.length === 0) return;

    pendingUploads = files.length;
    renderDetail();

    for (const file of files) {
      try {
        const blob = await compressImage(file);
        const path = `tasks/${id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
        const sRef = storageRef(storage, path);
        await uploadBytes(sRef, blob, { contentType: 'image/jpeg' });
        const url = await getDownloadURL(sRef);
        await updateDoc(doc(db, 'tasks', id), { photos: arrayUnion({ url, path }) });
      } catch (err) {
        console.error('Error uploading photo:', err);
        alert("Couldn't upload a photo. Check your connection and try again.");
      } finally {
        pendingUploads = Math.max(0, pendingUploads - 1);
        renderDetail();
      }
    }
  });

  photosGrid.addEventListener('click', (e) => {
    const viewBtn = e.target.closest('[data-action="view-photo"]');
    if (viewBtn) {
      lightboxImg.src = viewBtn.dataset.url;
      lightbox.classList.add('open');
      return;
    }
    const removeBtn = e.target.closest('[data-action="remove-photo"]');
    if (removeBtn) {
      if (!confirm('Delete this photo?')) return;
      const id = currentDetailId;
      const { path, url } = removeBtn.dataset;
      updateDoc(doc(db, 'tasks', id), { photos: arrayRemove({ url, path }) })
        .then(() => deleteObject(storageRef(storage, path)).catch(() => {}))
        .catch(console.error);
    }
  });

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  });

  render();
</script>
</body>
</html>
