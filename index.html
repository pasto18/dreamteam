<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DreamTeam - Tareas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #000000;
    color: #ffffff;
  }
  body {
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: #555555;
    text-transform: uppercase;
  }
  .title {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 2px 0 0;
  }
  .nav-btn {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    padding: 6px 8px;
  }
  .nav-btn:active { color: #ffffff; }

  .progress {
    margin-bottom: 14px;
  }
  .progress-text {
    font-size: 0.85rem;
    color: #8e8e93;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    border-radius: 3px;
    background: #1c1c1e;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #4cd964;
    border-radius: 3px;
    width: 0%;
    transition: width 0.25s;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .filter-btn {
    flex-shrink: 0;
    border: none;
    background: #1c1c1e;
    color: #8e8e93;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #ff9f0a;
    color: #000000;
  }

  .list {
    display: flex;
    flex-direction: column;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 4px;
    border-bottom: 1px solid #1c1c1e;
  }
  .task.hidden { display: none; }

  .status-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #48484a;
    background: transparent;
    color: #ffffff;
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-top: 2px;
  }
  .status-btn.progress {
    border-color: #ff9f0a;
    background: #ff9f0a;
  }
  .status-btn.done {
    border-color: #4cd964;
    background: #4cd964;
    color: #04310f;
  }

  .task-body {
    flex: 1;
    min-width: 0;
  }
  .task-text {
    font-size: 0.98rem;
    line-height: 1.35;
    color: #f2f2f7;
  }
  .task-text.done {
    color: #6d6d70;
    text-decoration: line-through;
  }

  .assignee-input {
    width: 100%;
    margin-top: 6px;
    background: none;
    border: none;
    border-bottom: 1px solid #2c2c2e;
    color: #ff9f0a;
    font-size: 0.85rem;
    padding: 4px 0;
    font-family: inherit;
  }
  .assignee-input:focus { outline: none; border-bottom-color: #ff9f0a; }
  .assignee-input::placeholder { color: #555555; }

  footer {
    margin-top: 18px;
    text-align: center;
    font-size: 0.68rem;
    color: #444444;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">DreamTeam</div>
        <div class="title">Tareas</div>
      </div>
      <a href="pitagoras.html" class="nav-btn" title="Calculadora">🧮</a>
    </div>

    <div class="progress">
      <div class="progress-text" id="progressText">0/0 completadas</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendientes</button>
      <button class="filter-btn" data-filter="progress">A medias</button>
      <button class="filter-btn" data-filter="done">Hechas</button>
    </div>

    <div class="list" id="taskList"></div>

    <footer>Toca el círculo para cambiar el estado · Escribe quién la lleva</footer>
  </div>

<script>
  const TASKS = [
    { id: 1,  emoji: '🔨', text: 'Put new wood on trailer subardo', assignee: '' },
    { id: 2,  emoji: '🔨', text: 'DT CONTAINER - set up scaffolding container dream team (ask Patrick to weld some parts?)', assignee: '' },
    { id: 3,  emoji: '🔨', text: "make a roof outside the door of dream team container, where there is already wood and a shitty fabric on it, (something hard so it doesn't rip off with the wind)", assignee: '' },
    { id: 4,  emoji: '🔧', text: 'konsum antenas upper parts need to be fixed by Patrick', assignee: 'Patrick' },
    { id: 5,  emoji: '🔨', text: 'DT CONTAINER - make the door of the DT container (also we need Patrick to weld)', assignee: 'Patrick' },
    { id: 6,  emoji: '🏷️', text: 'Label all the nails boxes for every tent', assignee: '' },
    { id: 7,  emoji: '📏', text: 'measure konsum picas - LISI and..', assignee: 'Lisi' },
    { id: 8,  emoji: '📏', text: 'measure subardo picas (puertas?) - LISI and..', assignee: 'Lisi' },
    { id: 9,  emoji: '🧹', text: 'DT CONTAINER - clean entrance container dream team', assignee: '' },
    { id: 10, emoji: '⛺', text: 'build down backstage of ballena', assignee: '' },
    { id: 11, emoji: '⛺', text: 'take care of rosa platz', assignee: '' },
    { id: 12, emoji: '⛺', text: 'take care of african tents (1 velvet soup, 2 behind salon de baile, 1 kitchen tanzwuste, 1 behind konsum)', assignee: '' },
    { id: 13, emoji: '🪢', text: 'DT CONTAINER - change the rope in the roof of the arch (cherry picker, 2 people) - FELIX and FABRI', assignee: 'Felix, Fabri' },
    { id: 14, emoji: '👀', text: 'Moltons LaBalena - find a solution to keep them safe - bags Fabri knows, same fabric as Palapa', assignee: '' },
    { id: 15, emoji: '🚜', text: 'take the arch of ballena door to dream team container - MANDA - HELENE', assignee: 'Manda, Helene' },
    { id: 16, emoji: '🚜', text: 'tapar trailer madera tribuna palapa', assignee: '' },
    { id: 17, emoji: '🚜', text: 'put the lower parts of the antenas of konsum in rosa platz - MANDA - HELENE', assignee: 'Manda, Helene' },
    { id: 18, emoji: '🚜', text: 'cargar trailer azul con metal de tribune de ballena - WALID-ANTO', assignee: 'Walid, Anto' },
  ];

  const STORAGE_KEY = 'dreamteam_tasks_v1';
  const STATUS_ORDER = ['pending', 'progress', 'done'];

  function loadState() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { saved = {}; }
    return TASKS.map(t => ({
      ...t,
      status: (saved[t.id] && saved[t.id].status) || 'pending',
      assignee: (saved[t.id] && saved[t.id].assignee !== undefined) ? saved[t.id].assignee : t.assignee,
    }));
  }

  function saveState() {
    const toSave = {};
    tasks.forEach(t => { toSave[t.id] = { status: t.status, assignee: t.assignee }; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  }

  let tasks = loadState();
  let currentFilter = 'all';

  const listEl = document.getElementById('taskList');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');

  function renderProgress() {
    const done = tasks.filter(t => t.status === 'done').length;
    progressText.textContent = `${done}/${tasks.length} completadas`;
    progressFill.style.width = tasks.length ? `${(done / tasks.length) * 100}%` : '0%';
  }

  function renderList() {
    listEl.innerHTML = tasks.map(t => {
      const isDone = t.status === 'done';
      const checkIcon = isDone ? '✓' : '';
      const prefix = isDone ? '✅ ' : '';
      const hiddenClass = (currentFilter !== 'all' && t.status !== currentFilter) ? 'hidden' : '';
      return `
        <div class="task ${hiddenClass}" data-id="${t.id}">
          <button class="status-btn ${t.status}" data-action="cycle" data-id="${t.id}">${checkIcon}</button>
          <div class="task-body">
            <div class="task-text ${isDone ? 'done' : ''}">${prefix}${t.emoji} ${escapeHtml(t.text)}</div>
            <input class="assignee-input" type="text" placeholder="Asignar a..." value="${escapeAttr(t.assignee)}" data-action="assignee" data-id="${t.id}">
          </div>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function render() {
    renderProgress();
    renderList();
  }

  listEl.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action="cycle"]');
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const task = tasks.find(t => t.id === id);
    const idx = STATUS_ORDER.indexOf(task.status);
    task.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
    saveState();
    render();
  });

  listEl.addEventListener('input', (e) => {
    const input = e.target.closest('[data-action="assignee"]');
    if (!input) return;
    const id = Number(input.dataset.id);
    const task = tasks.find(t => t.id === id);
    task.assignee = input.value;
    saveState();
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderList();
    });
  });

  render();
</script>
</body>
</html>
