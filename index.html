<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DreamTeam - Tareas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #000000;
    color: #ffffff;
  }
  body {
    display: flex;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .brand {
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: #555555;
    text-transform: uppercase;
  }
  .title {
    font-size: 1.4rem;
    font-weight: 700;
    margin: 2px 0 0;
  }
  .nav-btn {
    background: none;
    border: none;
    color: #8e8e93;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    text-decoration: none;
    padding: 6px 8px;
  }
  .nav-btn:active { color: #ffffff; }

  .progress {
    margin-bottom: 14px;
  }
  .progress-text {
    font-size: 0.85rem;
    color: #8e8e93;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 6px;
    border-radius: 3px;
    background: #1c1c1e;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: #4cd964;
    border-radius: 3px;
    width: 0%;
    transition: width 0.25s;
  }

  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .filter-btn {
    flex-shrink: 0;
    border: none;
    background: #1c1c1e;
    color: #8e8e93;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
  }
  .filter-btn.active {
    background: #ff9f0a;
    color: #000000;
  }

  .add-btn {
    width: 100%;
    border: 1px dashed #3a3a3c;
    background: none;
    color: #8e8e93;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .add-btn:active { background: #1c1c1e; }

  .add-form {
    background: #1c1c1e;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  .add-form.open { display: flex; }
  .form-input {
    width: 100%;
    background: #000000;
    border: 1px solid #2c2c2e;
    border-radius: 8px;
    color: #ffffff;
    font-size: 0.9rem;
    padding: 10px 12px;
    font-family: inherit;
  }
  .form-input:focus { outline: none; border-color: #ff9f0a; }
  .form-input::placeholder { color: #555555; }
  .form-actions {
    display: flex;
    gap: 10px;
  }
  .form-actions button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
  }
  .form-submit { background: #ff9f0a; color: #000000; }
  .form-submit:active { background: #ffb84d; }
  .form-cancel { background: #2c2c2e; color: #ffffff; }
  .form-cancel:active { background: #3a3a3c; }

  .list {
    display: flex;
    flex-direction: column;
  }

  .task {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 4px;
    border-bottom: 1px solid #1c1c1e;
  }
  .task.hidden { display: none; }

  .status-btn {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid #48484a;
    background: transparent;
    color: #ffffff;
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    margin-top: 2px;
  }
  .status-btn.progress {
    border-color: #ff9f0a;
    background: #ff9f0a;
  }
  .status-btn.done {
    border-color: #4cd964;
    background: #4cd964;
    color: #04310f;
  }

  .task-body {
    flex: 1;
    min-width: 0;
  }
  .task-text {
    font-size: 0.98rem;
    line-height: 1.35;
    color: #f2f2f7;
  }
  .task-text.done {
    color: #6d6d70;
    text-decoration: line-through;
  }

  .meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 8px;
  }
  .meta-input {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid #2c2c2e;
    color: #ffffff;
    font-size: 0.83rem;
    padding: 4px 0;
    font-family: inherit;
  }
  .meta-input:focus { outline: none; border-bottom-color: #ff9f0a; }
  .meta-input::placeholder { color: #555555; }
  .meta-input.assignee { color: #ff9f0a; }
  .meta-input.tools { color: #64d2ff; }
  .meta-input.location { color: #ff6482; }

  .delete-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: #48484a;
    font-size: 1.05rem;
    cursor: pointer;
    padding: 4px 2px;
    margin-top: 2px;
  }
  .delete-btn:active { color: #ff453a; }

  footer {
    margin-top: 18px;
    text-align: center;
    font-size: 0.68rem;
    color: #444444;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <div class="brand">DreamTeam</div>
        <div class="title">Tareas</div>
      </div>
      <a href="pitagoras.html" class="nav-btn" title="Calculadora">🧮</a>
    </div>

    <div class="progress">
      <div class="progress-text" id="progressText">0/0 completadas</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="pending">Pendientes</button>
      <button class="filter-btn" data-filter="progress">A medias</button>
      <button class="filter-btn" data-filter="done">Hechas</button>
    </div>

    <button class="add-btn" id="addToggleBtn">+ Añadir tarea</button>
    <div class="add-form" id="addForm">
      <input class="form-input" id="newText" placeholder="Descripción de la tarea">
      <input class="form-input" id="newTools" placeholder="🧰 Herramientas necesarias">
      <input class="form-input" id="newLocation" placeholder="📍 Sitio / carpa">
      <input class="form-input" id="newAssignee" placeholder="👤 Asignar a (opcional)">
      <div class="form-actions">
        <button class="form-cancel" id="cancelAddBtn" type="button">Cancelar</button>
        <button class="form-submit" id="submitAddBtn" type="button">Añadir</button>
      </div>
    </div>

    <div class="list" id="taskList"></div>

    <footer>Toca el círculo para cambiar el estado · 🗑 para borrar</footer>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
  import {
    getFirestore, collection, doc, getDoc, setDoc, addDoc, deleteDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCiXcWoZLR37Ildi1Uy1N-cgXkOPuamV2A",
    authDomain: "dreamteam-9ba54.firebaseapp.com",
    projectId: "dreamteam-9ba54",
    storageBucket: "dreamteam-9ba54.firebasestorage.app",
    messagingSenderId: "796331884443",
    appId: "1:796331884443:web:a18eb67205ff3799f82b3e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const tasksCol = collection(db, 'tasks');

  // Definición inicial (solo se usa una vez, para sembrar la base de datos la primera vez)
  const SEED_TASKS = [
    { id: 1,  emoji: '🔨', text: 'Put new wood on trailer subardo', assignee: '' },
    { id: 2,  emoji: '🔨', text: 'DT CONTAINER - set up scaffolding container dream team (ask Patrick to weld some parts?)', assignee: '' },
    { id: 3,  emoji: '🔨', text: "make a roof outside the door of dream team container, where there is already wood and a shitty fabric on it, (something hard so it doesn't rip off with the wind)", assignee: '' },
    { id: 4,  emoji: '🔧', text: 'konsum antenas upper parts need to be fixed by Patrick', assignee: 'Patrick' },
    { id: 5,  emoji: '🔨', text: 'DT CONTAINER - make the door of the DT container (also we need Patrick to weld)', assignee: 'Patrick' },
    { id: 6,  emoji: '🏷️', text: 'Label all the nails boxes for every tent', assignee: '' },
    { id: 7,  emoji: '📏', text: 'measure konsum picas - LISI and..', assignee: 'Lisi' },
    { id: 8,  emoji: '📏', text: 'measure subardo picas (puertas?) - LISI and..', assignee: 'Lisi' },
    { id: 9,  emoji: '🧹', text: 'DT CONTAINER - clean entrance container dream team', assignee: '' },
    { id: 10, emoji: '⛺', text: 'build down backstage of ballena', assignee: '' },
    { id: 11, emoji: '⛺', text: 'take care of rosa platz', assignee: '' },
    { id: 12, emoji: '⛺', text: 'take care of african tents (1 velvet soup, 2 behind salon de baile, 1 kitchen tanzwuste, 1 behind konsum)', assignee: '' },
    { id: 13, emoji: '🪢', text: 'DT CONTAINER - change the rope in the roof of the arch (cherry picker, 2 people) - FELIX and FABRI', assignee: 'Felix, Fabri' },
    { id: 14, emoji: '👀', text: 'Moltons LaBalena - find a solution to keep them safe - bags Fabri knows, same fabric as Palapa', assignee: '' },
    { id: 15, emoji: '🚜', text: 'take the arch of ballena door to dream team container - MANDA - HELENE', assignee: 'Manda, Helene' },
    { id: 16, emoji: '🚜', text: 'tapar trailer madera tribuna palapa', assignee: '' },
    { id: 17, emoji: '🚜', text: 'put the lower parts of the antenas of konsum in rosa platz - MANDA - HELENE', assignee: 'Manda, Helene' },
    { id: 18, emoji: '🚜', text: 'cargar trailer azul con metal de tribune de ballena - WALID-ANTO', assignee: 'Walid, Anto' },
  ];

  const STATUS_ORDER = ['pending', 'progress', 'done'];
  const DEFAULT_EMOJI = '📌';

  let tasks = [];
  let currentFilter = 'all';

  const listEl = document.getElementById('taskList');
  const progressText = document.getElementById('progressText');
  const progressFill = document.getElementById('progressFill');

  async function ensureSeeded() {
    await Promise.all(SEED_TASKS.map(async (t) => {
      const ref = doc(db, 'tasks', String(t.id));
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, {
          emoji: t.emoji,
          text: t.text,
          assignee: t.assignee,
          tools: '',
          location: '',
          status: 'pending',
          order: t.id,
        });
        return;
      }
      // Migración: rellena campos nuevos que falten sin pisar lo que el equipo ya haya editado
      const data = snap.data();
      const patch = {};
      if (data.text === undefined) patch.text = t.text;
      if (data.emoji === undefined) patch.emoji = t.emoji;
      if (data.tools === undefined) patch.tools = '';
      if (data.location === undefined) patch.location = '';
      if (data.order === undefined) patch.order = t.id;
      if (Object.keys(patch).length) await setDoc(ref, patch, { merge: true });
    }));
  }

  function mergeSnapshot(snapshot) {
    const list = [];
    snapshot.forEach(d => {
      const data = d.data();
      list.push({
        id: d.id,
        emoji: data.emoji || DEFAULT_EMOJI,
        text: data.text || '',
        assignee: data.assignee || '',
        tools: data.tools || '',
        location: data.location || '',
        status: data.status || 'pending',
        order: typeof data.order === 'number' ? data.order : 0,
      });
    });
    list.sort((a, b) => a.order - b.order);
    tasks = list;
    render();
  }

  ensureSeeded()
    .then(() => onSnapshot(tasksCol, mergeSnapshot, (err) => console.error('Firestore error:', err)))
    .catch((err) => console.error('Error inicializando Firestore:', err));

  function renderProgress() {
    const done = tasks.filter(t => t.status === 'done').length;
    progressText.textContent = `${done}/${tasks.length} completadas`;
    progressFill.style.width = tasks.length ? `${(done / tasks.length) * 100}%` : '0%';
  }

  function renderList() {
    // Conserva el foco y la posición del cursor si se está editando un campo de texto
    const active = document.activeElement;
    const focusedField = (active && active.dataset && active.dataset.field) ? active.dataset.field : null;
    const focusedId = focusedField ? active.dataset.id : null;
    const selStart = focusedId ? active.selectionStart : null;

    listEl.innerHTML = tasks.map(t => {
      const isDone = t.status === 'done';
      const checkIcon = isDone ? '✓' : '';
      const prefix = isDone ? '✅ ' : '';
      const hiddenClass = (currentFilter !== 'all' && t.status !== currentFilter) ? 'hidden' : '';
      return `
        <div class="task ${hiddenClass}" data-id="${t.id}">
          <button class="status-btn ${t.status}" data-action="cycle" data-id="${t.id}">${checkIcon}</button>
          <div class="task-body">
            <div class="task-text ${isDone ? 'done' : ''}">${prefix}${t.emoji} ${escapeHtml(t.text)}</div>
            <div class="meta">
              <input class="meta-input tools" type="text" placeholder="🧰 Herramientas necesarias..." value="${escapeAttr(t.tools)}" data-field="tools" data-id="${t.id}">
              <input class="meta-input location" type="text" placeholder="📍 Sitio / carpa..." value="${escapeAttr(t.location)}" data-field="location" data-id="${t.id}">
              <input class="meta-input assignee" type="text" placeholder="👤 Asignar a..." value="${escapeAttr(t.assignee)}" data-field="assignee" data-id="${t.id}">
            </div>
          </div>
          <button class="delete-btn" data-action="delete" data-id="${t.id}" title="Borrar tarea">🗑</button>
        </div>`;
    }).join('');

    if (focusedId) {
      const input = listEl.querySelector(`[data-field="${focusedField}"][data-id="${focusedId}"]`);
      if (input) {
        input.focus();
        input.setSelectionRange(selStart, selStart);
      }
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

  function render() {
    renderProgress();
    renderList();
  }

  const fieldTimers = {};

  listEl.addEventListener('click', (e) => {
    const cycleBtn = e.target.closest('[data-action="cycle"]');
    if (cycleBtn) {
      const id = cycleBtn.dataset.id;
      const task = tasks.find(t => t.id === id);
      const idx = STATUS_ORDER.indexOf(task.status);
      task.status = STATUS_ORDER[(idx + 1) % STATUS_ORDER.length];
      render();
      setDoc(doc(db, 'tasks', id), { status: task.status }, { merge: true }).catch(console.error);
      return;
    }
    const deleteBtn = e.target.closest('[data-action="delete"]');
    if (deleteBtn) {
      const id = deleteBtn.dataset.id;
      const task = tasks.find(t => t.id === id);
      if (task && confirm(`¿Borrar la tarea "${task.text.slice(0, 60)}"?`)) {
        deleteDoc(doc(db, 'tasks', id)).catch(console.error);
      }
      return;
    }
  });

  listEl.addEventListener('input', (e) => {
    const input = e.target.closest('[data-field]');
    if (!input) return;
    const id = input.dataset.id;
    const field = input.dataset.field;
    const task = tasks.find(t => t.id === id);
    if (task) task[field] = input.value;
    const key = id + ':' + field;
    clearTimeout(fieldTimers[key]);
    fieldTimers[key] = setTimeout(() => {
      setDoc(doc(db, 'tasks', id), { [field]: input.value }, { merge: true }).catch(console.error);
    }, 500);
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderList();
    });
  });

  // Añadir tarea nueva
  const addToggleBtn = document.getElementById('addToggleBtn');
  const addForm = document.getElementById('addForm');
  const newText = document.getElementById('newText');
  const newTools = document.getElementById('newTools');
  const newLocation = document.getElementById('newLocation');
  const newAssignee = document.getElementById('newAssignee');

  function resetAddForm() {
    newText.value = '';
    newTools.value = '';
    newLocation.value = '';
    newAssignee.value = '';
  }

  addToggleBtn.addEventListener('click', () => {
    addForm.classList.toggle('open');
    if (addForm.classList.contains('open')) newText.focus();
  });

  document.getElementById('cancelAddBtn').addEventListener('click', () => {
    resetAddForm();
    addForm.classList.remove('open');
  });

  document.getElementById('submitAddBtn').addEventListener('click', async () => {
    const text = newText.value.trim();
    if (!text) { newText.focus(); return; }
    await addDoc(tasksCol, {
      emoji: DEFAULT_EMOJI,
      text,
      tools: newTools.value.trim(),
      location: newLocation.value.trim(),
      assignee: newAssignee.value.trim(),
      status: 'pending',
      order: Date.now(),
    });
    resetAddForm();
    addForm.classList.remove('open');
  });

  render();
</script>
</body>
</html>
