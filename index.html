<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DreamTeam - Calculadora de Pitágoras</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: #000000;
    color: #ffffff;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .tpv {
    width: 100%;
    max-width: 380px;
    height: 100vh;
    max-height: 780px;
    background: #000000;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    color: #555555;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .steps {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #333333;
    transition: background 0.2s;
  }
  .dot.active { background: #ff9f0a; }
  .dot.done { background: #4cd964; }

  /* Pantalla estilo display de calculadora: sin recuadro, números flotando */
  .screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 10px 10px 22px;
  }
  .screen .label {
    font-size: 0.95rem;
    color: #8e8e93;
    text-align: right;
    margin-bottom: 6px;
  }
  .screen .value {
    font-size: 4.2rem;
    font-weight: 300;
    text-align: right;
    color: #ffffff;
    min-height: 1.1em;
    word-break: break-all;
    line-height: 1;
  }
  .screen .value .cursor {
    color: #ff9f0a;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 6px;
    font-size: 1.1rem;
    color: #8e8e93;
  }
  .summary-row span.v { font-weight: 500; color: #ffffff; font-size: 1.4rem; }

  .result-box {
    text-align: right;
    margin-top: 18px;
    padding: 0 6px;
  }
  .result-box .r-label {
    font-size: 0.95rem;
    color: #8e8e93;
    margin-bottom: 2px;
  }
  .result-box .r-value {
    font-size: 3.6rem;
    font-weight: 300;
    color: #ff9f0a;
    line-height: 1.05;
  }

  /* Teclado tipo iPhone: botones circulares flotantes sobre negro */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap: 12px;
    height: 340px;
  }
  .keypad button {
    border: none;
    background: #333333;
    color: #ffffff;
    font-size: 1.9rem;
    font-weight: 400;
    cursor: pointer;
    user-select: none;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    width: 100%;
    justify-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .keypad button:active { background: #575757; }
  .keypad button.fn {
    background: #a5a5a5;
    color: #000000;
  }
  .keypad button.fn:active { background: #cfcfcf; }

  .keypad button.enter {
    grid-row: 1 / 5;
    grid-column: 4;
    background: #ff9f0a;
    color: #ffffff;
    aspect-ratio: unset;
    border-radius: 34px;
    height: 100%;
    font-size: 1.15rem;
    font-weight: 500;
    writing-mode: horizontal-tb;
    text-align: center;
    padding: 0 4px;
  }
  .keypad button.enter:active { background: #ffb84d; }

  .keypad-single {
    height: 340px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .keypad-single button {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: none;
    background: #ff9f0a;
    color: #ffffff;
    font-size: 1.6rem;
    cursor: pointer;
  }
  .keypad-single button:active { background: #ffb84d; }

  .error {
    color: #ff453a;
    font-size: 0.85rem;
    text-align: right;
    padding: 0 6px;
    min-height: 1.1em;
  }

  footer {
    margin-top: 10px;
    text-align: center;
    font-size: 0.68rem;
    color: #444444;
  }
</style>
</head>
<body>
  <div class="tpv">
    <div class="brand">DreamTeam · Pitágoras</div>

    <div class="steps">
      <div class="dot" id="dot1"></div>
      <div class="dot" id="dot2"></div>
      <div class="dot" id="dot3"></div>
    </div>

    <!-- Pantalla principal (pasos 1 y 2) -->
    <div class="screen" id="entryScreen">
      <div class="label" id="entryLabel">Introduce el lado A</div>
      <div class="value" id="entryValue">0<span class="cursor">|</span></div>
    </div>
    <div class="error" id="errorMsg">&nbsp;</div>

    <!-- Pantalla resumen (paso 3) -->
    <div class="screen" id="resultScreen" style="display:none;">
      <div class="summary-row"><span>Lado A</span><span class="v" id="sumA">0</span></div>
      <div class="summary-row"><span>Lado B</span><span class="v" id="sumB">0</span></div>
      <div class="result-box">
        <div class="r-label">Hipotenusa</div>
        <div class="r-value" id="sumC">0</div>
      </div>
    </div>

    <!-- Teclado numérico tipo iPhone (pasos 1 y 2) -->
    <div class="keypad" id="entryPad">
      <button data-key="7">7</button>
      <button data-key="8">8</button>
      <button data-key="9">9</button>
      <button class="enter" data-key="enter">Siguiente</button>
      <button data-key="4">4</button>
      <button data-key="5">5</button>
      <button data-key="6">6</button>
      <button data-key="1">1</button>
      <button data-key="2">2</button>
      <button data-key="3">3</button>
      <button class="fn" data-key="back">⌫</button>
      <button class="fn" data-key=".">,</button>
      <button data-key="0">0</button>
    </div>

    <!-- Botón del paso final -->
    <div class="keypad-single" id="resultPad" style="display:none;">
      <button id="restartBtn">🔁</button>
    </div>

    <footer>a&sup2; + b&sup2; = c&sup2;</footer>
  </div>

<script>
  const state = { step: 1, a: '', b: '' };

  const entryScreen = document.getElementById('entryScreen');
  const resultScreen = document.getElementById('resultScreen');
  const entryPad = document.getElementById('entryPad');
  const resultPad = document.getElementById('resultPad');
  const entryLabel = document.getElementById('entryLabel');
  const entryValue = document.getElementById('entryValue');
  const errorMsg = document.getElementById('errorMsg');
  const dots = [document.getElementById('dot1'), document.getElementById('dot2'), document.getElementById('dot3')];

  function currentBuffer() {
    return state.step === 1 ? state.a : state.b;
  }
  function setBuffer(v) {
    if (state.step === 1) state.a = v; else state.b = v;
  }

  function render() {
    dots.forEach((d, i) => {
      d.classList.remove('active', 'done');
      if (i + 1 < state.step) d.classList.add('done');
      else if (i + 1 === state.step) d.classList.add('active');
    });

    if (state.step <= 2) {
      entryScreen.style.display = '';
      resultScreen.style.display = 'none';
      entryPad.style.display = '';
      resultPad.style.display = 'none';
      entryLabel.textContent = state.step === 1 ? 'Introduce el lado A' : 'Introduce el lado B';
      const buf = currentBuffer();
      entryValue.innerHTML = (buf === '' ? '0' : buf) + '<span class="cursor">|</span>';
      errorMsg.textContent = ' ';
    } else {
      entryScreen.style.display = 'none';
      resultScreen.style.display = '';
      entryPad.style.display = 'none';
      resultPad.style.display = '';
      const a = parseFloat(state.a);
      const b = parseFloat(state.b);
      const c = Math.sqrt(a * a + b * b);
      document.getElementById('sumA').textContent = a;
      document.getElementById('sumB').textContent = b;
      document.getElementById('sumC').textContent = c.toFixed(4);
    }
  }

  function handleKey(key) {
    if (state.step > 2) return;
    let buf = currentBuffer();

    if (key === 'back') {
      buf = buf.slice(0, -1);
      setBuffer(buf);
      render();
      return;
    }

    if (key === 'enter') {
      const n = parseFloat(buf);
      if (buf === '' || isNaN(n) || n <= 0) {
        errorMsg.textContent = 'Introduce un número válido mayor que 0';
        return;
      }
      state.step += 1;
      render();
      return;
    }

    if (key === '.') {
      if (buf.includes('.')) return;
      buf = (buf === '' ? '0' : buf) + '.';
      setBuffer(buf);
      render();
      return;
    }

    // dígito
    if (buf.length >= 10) return;
    buf = buf === '0' ? key : buf + key;
    setBuffer(buf);
    render();
  }

  entryPad.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    handleKey(btn.dataset.key);
  });

  document.getElementById('restartBtn').addEventListener('click', () => {
    state.step = 1;
    state.a = '';
    state.b = '';
    render();
  });

  document.addEventListener('keydown', (e) => {
    if (state.step > 2) return;
    if (/^[0-9]$/.test(e.key)) handleKey(e.key);
    else if (e.key === '.' || e.key === ',') handleKey('.');
    else if (e.key === 'Backspace') handleKey('back');
    else if (e.key === 'Enter') handleKey('enter');
  });

  render();
</script>
</body>
</html>
